# OVD Platform — DigitalOcean App Platform Spec
# Opción A: App Platform + Managed PostgreSQL + GenAI Platform
#
# Deploy:
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Prerequisitos (Bloque 3 — ejecuta el operador):
#   1. Secrets configurados en panel DO antes del primer deploy:
#      ANTHROPIC_API_KEY, OPENAI_API_KEY, OVD_ENGINE_SECRET, JWT_SECRET, OVD_ADMIN_PASSWORD
#   2. Dominio ovd-platform.codigonet.cloud: CNAME en Route 53 → <APP_URL>.ondigitalocean.app
#   3. Bootstrap RAG post-deploy (ver D5 en CURRENT.md)

name: ovd-platform
region: nyc

# ---------------------------------------------------------------------------
# Engine — FastAPI + LangGraph
# ---------------------------------------------------------------------------
services:
  - name: ovd-engine
    dockerfile_path: src/engine/Dockerfile
    github:
      repo: codigonet-cloud/ovd-platform
      branch: main
      deploy_on_push: true
    http_port: 8001
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 15
      timeout_seconds: 10
      failure_threshold: 5
    instance_count: 1
    instance_size_slug: professional-xs   # 2 vCPU / 4 GiB RAM — $50/mes
    envs:
      # Base de datos — DO inyecta la URL del managed PostgreSQL
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # NATS — hostname interno del servicio en el mismo App (C1)
      - key: NATS_URL
        scope: RUN_TIME
        value: nats://ovd-nats:4222
      # LLM — Claude vía DO GenAI Platform (A4: endpoint compatible Anthropic SDK)
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_BASE_URL
        scope: RUN_TIME
        value: https://inference.do-ai.run
      # RAG embeddings — BGE-M3 vía DO GenAI Platform (A4: compatible OpenAI SDK)
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_BASE_URL
        scope: RUN_TIME
        value: https://inference.do-ai.run/v1
      - key: OVD_RAG_EMBEDDING_PROVIDER
        scope: RUN_TIME
        value: openai
      - key: OVD_EMBED_MODEL
        scope: RUN_TIME
        value: bge-m3
      # Seguridad
      - key: OVD_ENGINE_SECRET
        scope: RUN_TIME
        type: SECRET
      # C8: JWT_SECRET — requerido para POST /auth/login (sin esto retorna 500)
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      # C5: Password del admin demo — el entrypoint genera el hash argon2 en startup
      - key: OVD_ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      # CORS — C6: dominio codigonet.cloud
      - key: OVD_CORS_ORIGINS
        scope: RUN_TIME
        value: https://ovd-platform.codigonet.cloud,https://ovd-platform-*.ondigitalocean.app
      # Modelos LLM
      - key: OVD_MODEL
        scope: RUN_TIME
        value: claude-sonnet-4-6
      - key: OVD_MODEL_CLAUDE
        scope: RUN_TIME
        value: claude-sonnet-4-6
      # C7: provider para agentes de implementación y análisis (no hay Ollama en DO)
      - key: OVD_AGENT_PROVIDER
        scope: RUN_TIME
        value: claude
      - key: OVD_LLM_TIMEOUT_SECS
        scope: RUN_TIME
        value: "300"
      # Observabilidad
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
      - key: LANGCHAIN_TRACING_V2
        scope: RUN_TIME
        value: "false"

  # C1: NATS como service (no worker) — los workers en DO App Platform no tienen
  # hostname interno ni pueden recibir conexiones TCP.
  # http_port: 8222 → monitoring endpoint (health check DO)
  # internal_ports: [4222] → client port NATS (solo accesible desde la red interna del App)
  - name: ovd-nats
    image:
      registry_type: DOCKER_HUB
      registry: library
      repository: nats
      tag: 2.10-alpine
    run_command: -js -m 8222
    # Sin http_port → sin ruta HTTP pública, sin conflicto en ingress.
    # internal_ports expone 4222 (NATS protocol) y 8222 (monitoring) solo internamente.
    internal_ports:
      - 4222
      - 8222
    health_check:
      http_path: /healthz
      port: 8222
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
    instance_count: 1
    instance_size_slug: basic-xxs   # 512 MiB RAM — ~$5/mes, suficiente para NATS

# ---------------------------------------------------------------------------
# Dashboard — React estático servido por nginx
# ---------------------------------------------------------------------------
static_sites:
  - name: ovd-dashboard
    dockerfile_path: src/dashboard/Dockerfile
    output_dir: /usr/share/nginx/html
    github:
      repo: codigonet-cloud/ovd-platform
      branch: main
      deploy_on_push: true
    envs:
      # C6: VITE_API_URL apunta al dominio de producción
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: https://ovd-platform.codigonet.cloud
# ---------------------------------------------------------------------------
# PostgreSQL 16 Managed (pgvector incluido nativamente en DO)
# D2: production: false → single-node ($15/mes). Upgrade a HA sin downtime desde panel DO.
# ---------------------------------------------------------------------------
databases:
  - name: db
    engine: PG
    version: "16"
    production: false
    cluster_name: ovd-postgres-prod

# ---------------------------------------------------------------------------
# Ingress — C10: routing centralizado (formato DO App Platform)
# El engine responde a sus prefijos API; el dashboard captura el resto (/).
# DO evalúa de más a menos específica — el prefijo más largo tiene prioridad.
# ---------------------------------------------------------------------------
ingress:
  rules:
    - component:
        name: ovd-engine
      match:
        path:
          prefix: /health
    - component:
        name: ovd-engine
      match:
        path:
          prefix: /auth
    - component:
        name: ovd-engine
      match:
        path:
          prefix: /session
    - component:
        name: ovd-engine
      match:
        path:
          prefix: /orgs
    - component:
        name: ovd-engine
      match:
        path:
          prefix: /projects
    - component:
        name: ovd-engine
      match:
        path:
          prefix: /config
    - component:
        name: ovd-engine
      match:
        path:
          prefix: /admin

# ---------------------------------------------------------------------------
# Dominio personalizado — C6
# Prerequisito: CNAME en Route 53 apuntando a <APP>.ondigitalocean.app
# DO emite TLS automáticamente al validar el CNAME.
# ---------------------------------------------------------------------------
domains:
  - domain: ovd-platform.codigonet.cloud
    type: PRIMARY
    zone: codigonet.cloud
