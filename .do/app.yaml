# OVD Platform — DigitalOcean App Platform Spec
# Opción A: App Platform + Managed PostgreSQL + GenAI Platform
#
# Deploy:
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Prerequisitos (Bloque 3 — ejecuta el operador):
#   1. Secrets configurados en panel DO antes del primer deploy:
#      ANTHROPIC_API_KEY, OPENAI_API_KEY, OVD_ENGINE_SECRET, JWT_SECRET, OVD_ADMIN_PASSWORD
#   2. Dominio ovd-platform.codigonet.cloud: CNAME en Route 53 → <APP_URL>.ondigitalocean.app
#   3. Bootstrap RAG post-deploy (ver D5 en CURRENT.md)

name: ovd-platform
region: nyc

# ---------------------------------------------------------------------------
# Engine — FastAPI + LangGraph
# ---------------------------------------------------------------------------
services:
  - name: ovd-engine
    source_dir: src/engine
    dockerfile_path: src/engine/Dockerfile
    github:
      repo: codigonet-cloud/ovd-platform
      branch: main
      deploy_on_push: true
    http_port: 8001
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 15
      timeout_seconds: 10
      failure_threshold: 5
    instance_count: 1
    instance_size_slug: professional-xs   # 2 vCPU / 4 GiB RAM — $50/mes
    # S115-E: deshabilitar buffer CDN para SSE streaming real (requiere dominio personalizado)
    # Sin esto Cloudflare acumula toda la respuesta antes de enviarla → SSE no funciona en tiempo real
    edge:
      disable_edge_cache: true
    envs:
      # Base de datos — DO inyecta la URL del managed PostgreSQL
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # NATS — hostname interno del servicio en el mismo App (C1)
      - key: NATS_URL
        scope: RUN_TIME
        value: nats://ovd-nats:4222
      # LLM — DO GenAI Platform usa protocolo OpenAI-compatible (/v1/chat/completions).
      # Los modelos Claude en DO usan el prefijo "anthropic-" en el nombre.
      # OPENAI_API_KEY = dop_v1_... (token DO) se configura como App-Level en panel DO.
      - key: OPENAI_BASE_URL
        scope: RUN_TIME
        value: https://inference.do-ai.run/v1
      # S112-fix: openai_base_url en settings.py para que ChatOpenAI use el endpoint DO explícitamente
      - key: OVD_OPENAI_BASE_URL
        scope: RUN_TIME
        value: https://inference.do-ai.run/v1
      # RAG embeddings — BGE-M3 vía DO GenAI Platform (mismo endpoint OpenAI-compatible)
      - key: OVD_RAG_EMBEDDING_PROVIDER
        scope: RUN_TIME
        value: openai
      - key: OVD_EMBED_MODEL
        scope: RUN_TIME
        value: bge-m3
      # Seguridad — OVD_ENGINE_SECRET, JWT_SECRET, OVD_ADMIN_PASSWORD
      # se configuran como App-Level en panel DO (no component-level)
      # CORS — C6: dominio codigonet.cloud
      - key: OVD_CORS_ORIGINS
        scope: RUN_TIME
        value: https://ovd-platform.codigonet.cloud,https://ovd-platform-*.ondigitalocean.app,tauri://localhost
      # Modelos LLM — nombres DO (prefijo anthropic- / openai- / llama3.3- etc.)
      # Ver catálogo completo: GET https://inference.do-ai.run/v1/models
      - key: OVD_MODEL
        scope: RUN_TIME
        value: anthropic-claude-4.6-sonnet
      # S112-fix: provider openai (ChatOpenAI) en lugar de claude (ChatAnthropic)
      # DO GenAI Platform NO soporta protocolo Anthropic nativo — solo OpenAI-compatible
      - key: OVD_AGENT_PROVIDER
        scope: RUN_TIME
        value: openai
      # S112: provider de análisis (analyzer/sdd/qa) — igual que agent provider en DO
      - key: OVD_ANALYSIS_PROVIDER
        scope: RUN_TIME
        value: openai
      # S115: todos los agentes usan DeepSeek V4 Pro (1M output tokens, mayor coherencia multi-archivo)
      # Benchmark SWE-bench: Claude Sonnet 77.2% vs DeepSeek V3.2 72-74% — DeepSeek V4 Pro supera a V3.2
      - key: OVD_MODEL_ANALYZER
        scope: RUN_TIME
        value: deepseek-v4-pro
      - key: OVD_MODEL_SDD
        scope: RUN_TIME
        value: deepseek-v4-pro
      - key: OVD_MODEL_QA
        scope: RUN_TIME
        value: deepseek-v4-pro
      - key: OVD_MODEL_BACKEND
        scope: RUN_TIME
        value: deepseek-v4-pro
      - key: OVD_MODEL_FRONTEND
        scope: RUN_TIME
        value: deepseek-v4-pro
      - key: OVD_MODEL_DATABASE
        scope: RUN_TIME
        value: deepseek-v4-pro
      - key: OVD_MODEL_DEVOPS
        scope: RUN_TIME
        value: deepseek-v4-pro
      - key: OVD_MODEL_SECURITY
        scope: RUN_TIME
        value: deepseek-v4-pro
      # S115: aumentado de 16384 a 32768 para generar 8+ archivos Python sin truncar
      - key: OVD_LLM_MAX_TOKENS
        scope: RUN_TIME
        value: "32768"
      - key: OVD_LLM_TIMEOUT_SECS
        scope: RUN_TIME
        value: "300"
      # S116-A: aumentado de 900s a 3600s — ciclos complejos (3 retries × 12 tasks) requieren ~45-60 min
      # Causa raíz: asyncio.timeout(900) en _run_graph_background mataba el background task a los 15 min
      - key: OVD_SSE_STREAM_TIMEOUT_SECS
        scope: RUN_TIME
        value: "3600"
      # Observabilidad
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
      - key: LANGCHAIN_TRACING_V2
        scope: RUN_TIME
        value: "false"

  # C1: NATS como service (no worker) — los workers en DO App Platform no tienen
  # hostname interno ni pueden recibir conexiones TCP.
  # http_port: 8222 → monitoring endpoint (health check DO)
  # internal_ports: [4222] → client port NATS (solo accesible desde la red interna del App)
  - name: ovd-nats
    image:
      registry_type: DOCKER_HUB
      registry: library
      repository: nats
      tag: 2.10-alpine
    run_command: nats-server -js -m 8222
    # Sin http_port → sin ruta HTTP pública, sin conflicto en ingress.
    # internal_ports expone 4222 (NATS protocol) y 8222 (monitoring) solo internamente.
    internal_ports:
      - 4222
      - 8222
    health_check:
      http_path: /healthz
      port: 8222
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
    instance_count: 1
    instance_size_slug: basic-xxs   # 512 MiB RAM — ~$5/mes, suficiente para NATS

# ---------------------------------------------------------------------------
# Dashboard — React estático servido por nginx
# ---------------------------------------------------------------------------
static_sites:
  - name: ovd-dashboard
    source_dir: src/dashboard
    dockerfile_path: src/dashboard/Dockerfile
    output_dir: /usr/share/nginx/html
    catchall_document: index.html
    github:
      repo: codigonet-cloud/ovd-platform
      branch: main
      deploy_on_push: true
    envs:
      # C6: VITE_API_URL apunta al dominio de producción
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: https://ovd-platform.codigonet.cloud
# ---------------------------------------------------------------------------
# PostgreSQL 16 Managed (pgvector incluido nativamente en DO)
# D2: production: true → cluster standalone ($15/mes, single-node).
# Con production: false (dev DB interna), el usuario inyectado es 'db'
# con REVOKE en schema public — no puede ejecutar Alembic.
# Con production: true, DATABASE_URL usa doadmin con privilegios completos.
# Upgrade a HA sin downtime desde panel DO.
# ---------------------------------------------------------------------------
databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: ovd-postgres-prod

# ---------------------------------------------------------------------------
# Ingress — C10: routing centralizado (formato DO App Platform)
# El engine responde a sus prefijos API; el dashboard captura el resto (/).
# DO evalúa de más a menos específica — el prefijo más largo tiene prioridad.
# ---------------------------------------------------------------------------
ingress:
  rules:
    - component:
        name: ovd-engine
        preserve_path_prefix: true
      match:
        path:
          prefix: /health
    - component:
        name: ovd-engine
        preserve_path_prefix: true
      match:
        path:
          prefix: /auth
    - component:
        name: ovd-engine
        preserve_path_prefix: true
      match:
        path:
          prefix: /session
    # S112-fix: /orgs, /projects, /config eliminados — no hay rutas engine en esos prefijos
    # (todas las rutas API van por /api/v1/). Evita secuestrar rutas SPA React.
    # /admin reducido a ruta específica del engine (nightly research).
    # /admin/users y /admin/skills son rutas SPA — deben llegar al catch-all dashboard.
    - component:
        name: ovd-engine
        preserve_path_prefix: true
      match:
        path:
          prefix: /admin/nightly-research
    # API REST v1 — rutas /api/v1/... → engine (S112: fix ingress faltante)
    - component:
        name: ovd-engine
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    # Catch-all: todo lo que no matchea el engine va al dashboard (SPA React)
    - component:
        name: ovd-dashboard
      match:
        path:
          prefix: /

# ---------------------------------------------------------------------------
# Dominio personalizado — C6
# Prerequisito: CNAME en Route 53 apuntando a <APP>.ondigitalocean.app
# DO emite TLS automáticamente al validar el CNAME.
# ---------------------------------------------------------------------------
domains:
  - domain: ovd-platform.codigonet.cloud
    type: PRIMARY
    zone: codigonet.cloud
