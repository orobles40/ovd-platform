[project]
name = "ovd-engine"
version = "0.1.0"
description = "OVD Platform — Motor LangGraph multi-agente"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "nats-py>=2.6.0",
    "duckduckgo-search>=6.0.0",
    # Sprint 9 — Secrets Management (Infisical)
    "infisical-python>=1.5.0",
    # Sprint 10 — Auth: JWT access tokens + refresh tokens
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "langchain-postgres>=0.0.17",
    "langchain-ollama>=1.1.0",
    "psycopg2-binary>=2.9.11",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.26",
    # Fase A — MCP Client (context7 + servidores futuros)
    "mcp>=1.0",
    # Migraciones de esquema (runtime — necesario en entrypoint Docker)
    "alembic>=1.18.4",
    # S20 — Resiliencia: retries con backoff exponencial y circuit breaker
    "tenacity>=8.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "unit: test unitario sin infraestructura (default)",
    "integration: requiere PostgreSQL y NATS reales",
    "e2e: smoke test contra engine completo",
    "regression: verifica contratos de sprints anteriores",
    "docker: requiere Docker daemon corriendo (Block D)",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", ".pytest_cache", ".ruff_cache", "migrations"]

[tool.ruff.lint]
# Fases activas: E (errores estilo), F (Pyflakes), I (imports)
# UP / B / C4 / SIM se habilitan en sprints futuros según PLAN_MANTENIBILIDAD.md
select = ["E", "F", "I"]
ignore = [
    "E401",  # múltiples imports en una línea — limpiar gradual
    "E402",  # import no al inicio — intencional (load_dotenv antes de imports)
    "E501",  # línea demasiado larga — lo gestiona ruff format
    "E741",  # nombre de variable ambiguo — requiere revisión manual
    "F401",  # import no usado — gestionar por archivo (graph.py usa imports dinámicos)
    "F811",  # redefinición — común en tests
    "F821",  # nombre indefinido — requiere investigación individual
    "F841",  # variable local no usada — requiere revisión manual
    "B008",  # function call en default arg — patrón FastAPI Depends()
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"graph.py" = ["F401"]
"tests/**/*.py" = ["F401", "F811", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
# uv genera uv.lock automáticamente al hacer `uv sync`
# Commitear uv.lock para reproducibilidad en CI/CD y Docker
